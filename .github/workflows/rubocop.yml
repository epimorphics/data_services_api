name: Check Rubocop compliance

on: [push, pull_request]

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.4"

    - name: Install dependencies (bundle)
      run: bundle install

    - name: Run Rubocop
      run: rubocop
